name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o clean_ai_flutter.zip
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: clean_ai
        run: flutter create --platforms=android --project-name clean_ai --org com.cleanai .
      - working-directory: clean_ai
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - working-directory: clean_ai
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: clean-ai-apk
          path: clean_ai/build/app/outputs/flutter-apk/app-release.apk
